@keyframes in{from{opacity:0} to{opacity:1}}
@keyframes pop{from{opacity:0; transform:scale(.2)} to{opacity:1; transform:scale(1)}}
@keyframes blink{50%{opacity:.2}}
@keyframes spin{to{transform:rotate(360deg)}}
