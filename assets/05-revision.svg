<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="280" viewBox="0 0 1200 280" role="img" aria-label="05 Mes révisions (oct. 2026) : site de révision du M1 MIASHS">
<style>
.s{font-family:'Helvetica Neue', Helvetica, Arial, sans-serif} .m{font-family:'SFMono-Regular', Menlo, Consolas, 'Liberation Mono', monospace}
.in{opacity:0; animation:in .7s cubic-bezier(.2,.75,.2,1) forwards}
.pop{opacity:0; transform-box:fill-box; transform-origin:center; animation:pop .6s cubic-bezier(.3,1.45,.5,1) forwards}
.left{opacity:0; animation:left .8s cubic-bezier(.2,.75,.2,1) forwards}
.draw{stroke-dasharray:1; stroke-dashoffset:1; animation:draw 2s cubic-bezier(.55,.1,.35,1) forwards}
@keyframes in{from{opacity:0; transform:translateY(10px)} to{opacity:1; transform:none}}
@keyframes left{from{opacity:0; transform:translateX(-30px)} to{opacity:1; transform:none}}
@keyframes pop{from{opacity:0; transform:scale(.3)} to{opacity:1; transform:scale(1)}}
@keyframes draw{to{stroke-dashoffset:0}}
@keyframes grow{to{transform:scaleY(1)}}
@keyframes spin{to{transform:rotate(360deg)}}
@keyframes breathe{from{transform:scaleY(1)} to{transform:scaleY(.8)}}
@keyframes ring{from{transform:scale(.4); opacity:.9} to{transform:scale(2.2); opacity:0}}
@keyframes flow{to{stroke-dashoffset:-12}}
@keyframes flip{0%,40%,60%,100%{transform:scaleX(1)} 50%{transform:scaleX(0)}}</style>
<rect width="1200" height="280" fill="#f2ede3"/>
<rect width="280" height="280" fill="#19a974"/>
<text x="28" y="92" class="s in" font-size="72" font-weight="800" letter-spacing="-3" fill="#f2ede3">05</text>
<g transform="translate(8 20) scale(.66)"><g style="transform:translate(176px, 242px) rotate(-9deg)"><rect x="-95" y="-58" width="190" height="116" rx="10" fill="#f2ede3" stroke="#141414" stroke-width="2.5"/></g><g style="transform:translate(202px, 236px) rotate(6deg)"><rect x="-95" y="-58" width="190" height="116" rx="10" fill="#f2ede3" stroke="#141414" stroke-width="2.5"/></g><g style="transform:translate(190px, 228px)"><g style="animation:flip 5s ease-in-out infinite"><rect x="-95" y="-58" width="190" height="116" rx="10" fill="#f2ede3" stroke="#141414" stroke-width="2.5"/><text x="0" y="10" text-anchor="middle" class="s" font-size="30" font-weight="800" fill="#141414">ACP ?</text></g></g></g>
<text x="320" y="58" class="m in" font-size="13" letter-spacing="2.5" fill="#5b554b">OCT. 2026 · PROJET PERSO · EN LIGNE</text>
<text x="1160" y="58" text-anchor="end" class="m in" font-size="13" letter-spacing="2.5" font-weight="700" fill="#141414">DÉPÔT ↗</text>
<line x1="320" y1="74" x2="1160" y2="74" stroke="#141414" stroke-width="2" class="in"/>
<text x="318" y="128" class="s in" font-size="44" font-weight="800" letter-spacing="-1.5" fill="#141414" style="animation-delay:.1s">Mes révisions</text>
<text x="320" y="166" class="s in" font-size="17" fill="#2a2620" style="animation-delay:.2s">Mon site de révision du M1 : ACP, régression, classification, optimisation… avec flashcards,</text>
<text x="320" y="192" class="s in" font-size="17" fill="#2a2620" style="animation-delay:.2s">QCM et TP en R et Python qui tournent dans le navigateur.</text>
<g class="pop" style="animation-delay:0.60s"><rect x="320" y="218" width="77" height="34" rx="17" fill="none" stroke="#141414" stroke-width="1.6"/><text x="358" y="240" text-anchor="middle" class="m" font-size="13" fill="#141414">Svelte</text></g><g class="pop" style="animation-delay:0.67s"><rect x="406.8" y="218" width="61" height="34" rx="17" fill="none" stroke="#141414" stroke-width="1.6"/><text x="437" y="240" text-anchor="middle" class="m" font-size="13" fill="#141414">webR</text></g><g class="pop" style="animation-delay:0.74s"><rect x="478.0" y="218" width="85" height="34" rx="17" fill="none" stroke="#141414" stroke-width="1.6"/><text x="520" y="240" text-anchor="middle" class="m" font-size="13" fill="#141414">Pyodide</text></g><g class="pop" style="animation-delay:0.81s"><rect x="572.6" y="218" width="69" height="34" rx="17" fill="none" stroke="#141414" stroke-width="1.6"/><text x="607" y="240" text-anchor="middle" class="m" font-size="13" fill="#141414">D3.js</text></g>
</svg>
