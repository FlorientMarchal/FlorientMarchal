<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="320" viewBox="0 0 1200 320" role="img" aria-label="05 Mes révisions : site de révision du M1 MIASHS">
<style>
.s{font-family:'Helvetica Neue', Helvetica, Arial, sans-serif} .m{font-family:'SFMono-Regular', Menlo, Consolas, 'Liberation Mono', monospace}
.in{opacity:0; animation:in .7s cubic-bezier(.2,.75,.2,1) forwards}
.pop{opacity:0; transform-box:fill-box; transform-origin:center; animation:pop .6s cubic-bezier(.3,1.45,.5,1) forwards}
.left{opacity:0; animation:left .8s cubic-bezier(.2,.75,.2,1) forwards}
.draw{stroke-dasharray:1200; stroke-dashoffset:1200; animation:draw 2s cubic-bezier(.55,.1,.35,1) forwards}
.grow{transform-box:fill-box; transform-origin:bottom; transform:scaleY(0); animation:grow .8s cubic-bezier(.2,.75,.2,1) forwards}
@keyframes in{from{opacity:0; transform:translateY(10px)} to{opacity:1; transform:none}}
@keyframes left{from{opacity:0; transform:translateX(-30px)} to{opacity:1; transform:none}}
@keyframes pop{from{opacity:0; transform:scale(.3)} to{opacity:1; transform:scale(1)}}
@keyframes draw{to{stroke-dashoffset:0}}
@keyframes grow{to{transform:scaleY(1)}}
@keyframes spin{to{transform:rotate(360deg)}}
@keyframes breathe{from{transform:scaleY(1)} to{transform:scaleY(.72)}}
@keyframes flip{0%,40%,60%,100%{transform:scaleX(1)} 50%{transform:scaleX(0)}}</style>
<rect width="1200" height="320" fill="#f2ede3"/>
<rect width="380" height="320" fill="#19a974"/>
<text x="34" y="128" class="s in" font-size="120" font-weight="800" letter-spacing="-4" fill="#f2ede3">05</text>
<g><g style="transform:translate(176px, 242px) rotate(-9deg)"><rect x="-95" y="-58" width="190" height="116" rx="10" fill="#f2ede3" stroke="#141414" stroke-width="2.5"/></g><g style="transform:translate(202px, 236px) rotate(6deg)"><rect x="-95" y="-58" width="190" height="116" rx="10" fill="#f2ede3" stroke="#141414" stroke-width="2.5"/></g><g style="transform:translate(190px, 228px)"><g style="animation:flip 5s ease-in-out infinite"><rect x="-95" y="-58" width="190" height="116" rx="10" fill="#f2ede3" stroke="#141414" stroke-width="2.5"/><text x="0" y="10" text-anchor="middle" class="s" font-size="30" font-weight="800" fill="#141414">Q ?</text></g></g></g>
<text x="420" y="64" class="m in" font-size="13" letter-spacing="2.5" fill="#5b554b">PROJET PERSO · EN LIGNE</text>
<text x="1160" y="64" text-anchor="end" class="m in" font-size="13" letter-spacing="2.5" font-weight="700" fill="#141414">DÉPÔT ↗</text>
<line x1="420" y1="80" x2="1160" y2="80" stroke="#141414" stroke-width="2" class="in"/>
<text x="418" y="138" class="s in" font-size="46" font-weight="800" letter-spacing="-1.5" fill="#141414" style="animation-delay:.1s">Mes révisions</text>
<text x="420" y="178" class="s in" font-size="17" fill="#2a2620" style="animation-delay:.2s">Mon site de révision du M1 : fiches, flashcards, QCM, annales corrigées,</text>
<text x="420" y="204" class="s in" font-size="17" fill="#2a2620" style="animation-delay:.2s">et TP en R, Python et D3 qui s'exécutent dans le navigateur.</text>
<g class="pop" style="animation-delay:0.60s"><rect x="420" y="250" width="77" height="34" rx="17" fill="none" stroke="#141414" stroke-width="1.6"/><text x="458" y="272" text-anchor="middle" class="m" font-size="13" fill="#141414">Svelte</text></g><g class="pop" style="animation-delay:0.67s"><rect x="506.8" y="250" width="61" height="34" rx="17" fill="none" stroke="#141414" stroke-width="1.6"/><text x="537" y="272" text-anchor="middle" class="m" font-size="13" fill="#141414">webR</text></g><g class="pop" style="animation-delay:0.74s"><rect x="578.0" y="250" width="85" height="34" rx="17" fill="none" stroke="#141414" stroke-width="1.6"/><text x="620" y="272" text-anchor="middle" class="m" font-size="13" fill="#141414">Pyodide</text></g><g class="pop" style="animation-delay:0.81s"><rect x="672.6" y="250" width="69" height="34" rx="17" fill="none" stroke="#141414" stroke-width="1.6"/><text x="707" y="272" text-anchor="middle" class="m" font-size="13" fill="#141414">D3.js</text></g>
</svg>
