<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="290" viewBox="0 0 1200 290" role="img" aria-label="Planche 05, Mes révisions : site de révision du M1 MIASHS">
<style>
.s{font-family:'Helvetica Neue', Helvetica, Arial, sans-serif} .m{font-family:'SFMono-Regular', Menlo, Consolas, 'Liberation Mono', monospace}
.d{fill:none; stroke:#eaf2ff; stroke-width:2; stroke-linecap:round; stroke-linejoin:round;
   stroke-dasharray:1; stroke-dashoffset:1; animation:draw 1.6s cubic-bezier(.55,.1,.35,1) forwards}
.dc{stroke:#ff8a7a; stroke-width:2.5}
.dim{fill:none; stroke:#7fd3ff; stroke-width:1.2; stroke-dasharray:1; stroke-dashoffset:1; animation:draw 1s ease forwards}
.in{opacity:0; animation:in .6s ease forwards}
.pop{opacity:0; transform-box:fill-box; transform-origin:center; animation:pop .5s cubic-bezier(.3,1.45,.5,1) forwards}
@keyframes draw{to{stroke-dashoffset:0}}
@keyframes in{from{opacity:0} to{opacity:1}}
@keyframes pop{from{opacity:0; transform:scale(.2)} to{opacity:1; transform:scale(1)}}
@keyframes blink{50%{opacity:.2}}
@keyframes spin{to{transform:rotate(360deg)}}
@keyframes flip{0%,40%,60%,100%{transform:scaleX(1)} 50%{transform:scaleX(0)}}</style>
<defs><pattern id="g" width="20" height="20" patternUnits="userSpaceOnUse"><path d="M20 0H0V20" fill="none" stroke="rgba(234,242,255,.07)"/></pattern><pattern id="G" width="100" height="100" patternUnits="userSpaceOnUse"><path d="M100 0H0V100" fill="none" stroke="rgba(234,242,255,.14)"/></pattern></defs><rect width="1200" height="290" fill="#123a7a"/><rect width="1200" height="290" fill="url(#g)"/><rect width="1200" height="290" fill="url(#G)"/><rect x="12" y="12" width="1176" height="266" fill="none" stroke="#eaf2ff" stroke-width="2.5"/><rect x="20" y="20" width="1160" height="250" fill="none" stroke="rgba(234,242,255,.55)" stroke-width="1"/><path d="M100 12V20M100 270V278M200 12V20M200 270V278M300 12V20M300 270V278M400 12V20M400 270V278M500 12V20M500 270V278M600 12V20M600 270V278M700 12V20M700 270V278M800 12V20M800 270V278M900 12V20M900 270V278M1000 12V20M1000 270V278M1100 12V20M1100 270V278M12 100H20M1180 100H1188M12 200H20M1180 200H1188" stroke="#eaf2ff" stroke-width="1.5"/>
<line x1="430" y1="20" x2="430" y2="270" stroke="rgba(234,242,255,.55)" stroke-width="1"/>
<g><path d="M110 105H330V215H110Z" pathLength="1" class="d" style="animation-delay:0.20s" transform="rotate(-6 220 160)"/><path d="M110 105H330V215H110Z" pathLength="1" class="d" style="animation-delay:0.40s" transform="rotate(4 220 160)"/><g style="transform:translate(220px,160px)"><g style="animation:flip 5s ease-in-out infinite"><rect x="-110" y="-55" width="220" height="110" fill="#0f3270" stroke="#ffd166" stroke-width="2"/><text x="0" y="8" text-anchor="middle" class="m" font-size="22" font-weight="700" fill="#ffd166">Q ?</text></g></g></g>
<text x="40" y="52" class="m in" font-size="12" letter-spacing="3" fill="#7fd3ff">PLANCHE 05 / 05</text>
<text x="460" y="74" class="m in" font-size="38" font-weight="700" letter-spacing="1" fill="#eaf2ff" style="animation-delay:.1s">MES RÉVISIONS</text>
<path d="M462 90H771" pathLength="1" class="d" style="animation-delay:0.40s" />
<text x="460" y="126" class="s in" font-size="16.5" fill="#eaf2ff" style="animation-delay:.2s">Mon site de révision du M1 : fiches, flashcards, QCM, annales corrigées,</text>
<text x="460" y="151" class="s in" font-size="16.5" fill="#eaf2ff" style="animation-delay:.2s">et TP en R, Python et D3 qui s'exécutent dans le navigateur.</text>
<g class="in" style="animation-delay:.6s"><rect x="460" y="194" width="200" height="56" fill="#0f3270" stroke="#eaf2ff" stroke-width="1.5"/><text x="472" y="213" class="m" font-size="10.5" letter-spacing="1.5" fill="#7fd3ff">CONTEXTE</text><text x="472" y="236" class="m" font-size="13.5" fill="#eaf2ff">PROJET PERSO</text><rect x="660" y="194" width="300" height="56" fill="#0f3270" stroke="#eaf2ff" stroke-width="1.5"/><text x="672" y="213" class="m" font-size="10.5" letter-spacing="1.5" fill="#7fd3ff">STACK</text><text x="672" y="236" class="m" font-size="13.5" fill="#eaf2ff">SVELTE · WEBR · PYODIDE</text></g>
