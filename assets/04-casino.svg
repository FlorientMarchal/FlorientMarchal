<text x="320" y="58" class="m in" font-size="13" letter-spacing="2.5" fill="#5b554b">SEPT.–OCT. 2026 · COURS DE PROGRAMMATION AGENTIQUE</text>
<text x="1160" y="58" text-anchor="end" class="m in" font-size="13" letter-spacing="2.5" font-weight="700" fill="#141414">DÉPÔT ↗</text>
<line x1="320" y1="74" x2="1160" y2="74" stroke="#141414" stroke-width="2" class="in"/>
<text x="318" y="128" class="s in" font-size="44" font-weight="800" letter-spacing="-1.5" fill="#141414" style="animation-delay:.1s">Casino Fantôme</text>
