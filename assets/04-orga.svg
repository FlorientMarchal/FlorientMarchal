<text x="460" y="194" class="m in" font-size="11.5" letter-spacing="3" fill="#ffd166" style="animation-delay:.3s">CE QUE FAIT LE PROJET</text>
<text x="460" y="224" class="m in" font-size="13" font-weight="700" fill="#ffd166" style="animation-delay:0.40s">A</text><text x="486" y="224" class="s in" font-size="16" fill="#eaf2ff" style="animation-delay:0.40s">Un simulateur fondé sur une régression linéaire (R), sur 400 profils Kaggle</text>
