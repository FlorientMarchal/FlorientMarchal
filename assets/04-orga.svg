<text x="460" y="282" class="m in" font-size="13" font-weight="700" fill="#ffd166" style="animation-delay:0.64s">C</text><text x="486" y="282" class="s in" font-size="16" fill="#eaf2ff" style="animation-delay:0.64s">Personas, story map, MCD ; requêtes préparées et mots de passe hachés</text>
