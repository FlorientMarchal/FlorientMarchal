<g class="pop" style="animation-delay:0.58s"><rect x="135.57999999999998" y="216" width="68" height="30" rx="15" fill="#ffffff" stroke="#d3d9e2"/><circle cx="151.57999999999998" cy="231" r="4.5" fill="#276dc3"/><text x="163.57999999999998" y="235.5" class="mono" font-size="13" fill="#2d3749">webR</text></g>
<g class="pop" style="animation-delay:0.66s"><rect x="211.29999999999998" y="216" width="92" height="30" rx="15" fill="#ffffff" stroke="#d3d9e2"/><circle cx="227.29999999999998" cy="231" r="4.5" fill="#3776ab"/><text x="239.29999999999998" y="235.5" class="mono" font-size="13" fill="#2d3749">Pyodide</text></g>
<g class="pop" style="animation-delay:0.74s"><rect x="310.80999999999995" y="216" width="76" height="30" rx="15" fill="#ffffff" stroke="#d3d9e2"/><circle cx="326.80999999999995" cy="231" r="4.5" fill="#f9a03c"/><text x="338.80999999999995" y="235.5" class="mono" font-size="13" fill="#2d3749">D3.js</text></g>
<g class="pop" style="animation-delay:0.82s"><rect x="394.4599999999999" y="216" width="76" height="30" rx="15" fill="#ffffff" stroke="#d3d9e2"/><circle cx="410.4599999999999" cy="231" r="4.5" fill="#008080"/><text x="422.4599999999999" y="235.5" class="mono" font-size="13" fill="#2d3749">KaTeX</text></g>
<g class="pop" style="animation-delay:0.90s"><rect x="478.1099999999999" y="216" width="99" height="30" rx="15" fill="#ffffff" stroke="#d3d9e2"/><circle cx="494.1099999999999" cy="231" r="4.5" fill="#3ecf8e"/><text x="506.1099999999999" y="235.5" class="mono" font-size="13" fill="#2d3749">Supabase</text></g>
<g style="animation:nudge 2.4s ease-in-out infinite"><text x="726" y="236" text-anchor="end" class="sans" font-size="17" font-weight="600" fill="#1f4fb5">Voir le site →</text></g>
<g transform="translate(980 140) rotate(-8)"><rect x="-110" y="-66" width="220" height="132" rx="12" fill="#f6f8fb" stroke="#d3d9e2"/></g>
<g transform="translate(980 140) rotate(5)"><rect x="-110" y="-66" width="220" height="132" rx="12" fill="#f6f8fb" stroke="#d3d9e2"/></g>
