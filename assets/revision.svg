<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="290" viewBox="0 0 1200 290" role="img" aria-label="Mes révisions : site de révision du M1 MIASHS">
<style>
.mono{font-family:'SFMono-Regular', Menlo, Consolas, 'Liberation Mono', monospace} .serif{font-family:Georgia, 'Iowan Old Style', 'Times New Roman', serif} .sans{font-family:-apple-system, 'Segoe UI', Helvetica, Arial, sans-serif}
.pop{opacity:0; transform-box:fill-box; transform-origin:center; animation:pop .5s cubic-bezier(.3,1.45,.5,1) forwards}
.fade{opacity:0; animation:fade .6s ease forwards}
.draw{stroke-dasharray:1000; stroke-dashoffset:1000; animation:draw 1.4s cubic-bezier(.55,.1,.35,1) forwards}
@keyframes pop{from{opacity:0; transform:scale(.2)} to{opacity:1; transform:scale(1)}}
@keyframes fade{from{opacity:0; transform:translateY(6px)} to{opacity:1; transform:none}}
@keyframes draw{to{stroke-dashoffset:0}}
@keyframes blink{50%{opacity:0}}
@keyframes nudge{0%,70%,100%{transform:translateX(0)} 85%{transform:translateX(5px)}}
@keyframes flip{0%,40%{transform:scaleX(1)} 50%{transform:scaleX(0)} 60%,90%{transform:scaleX(1)} 95%{transform:scaleX(0)} 100%{transform:scaleX(1)}}.fq{animation:fq 6s steps(1) infinite} .fr{animation:fr 6s steps(1) infinite}@keyframes fq{0%{opacity:1} 50%{opacity:0} 95%{opacity:1}} @keyframes fr{0%{opacity:0} 50%{opacity:1} 95%{opacity:0}}</style>
<defs><clipPath id="k"><rect x="1" y="1" width="1198" height="284" rx="14"/></clipPath><pattern id="fg" width="24" height="24" patternUnits="userSpaceOnUse"><path d="M24 0H0V24" fill="none" stroke="#e8edf5"/></pattern></defs>
<rect x="1" y="5" width="1198" height="284" rx="14" fill="#c9d2de" opacity=".45"/>
<rect x="1" y="1" width="1198" height="284" rx="14" fill="#ffffff" stroke="#d3d9e2"/>
<rect x="760" y="1" width="440" height="290" fill="url(#fg)" clip-path="url(#k)"/>
<line x1="760" y1="1" x2="760" y2="285" stroke="#e3786e" stroke-width="2"/>
<rect x="1" y="1" width="8" height="290" fill="#1f4fb5" clip-path="url(#k)"/>
<text x="44" y="56" class="mono fade" font-size="13" letter-spacing="2" fill="#525d6f">PROJET PHARE · EN LIGNE</text>
<text x="42" y="104" class="serif fade" style="animation-delay:.1s" font-size="42" font-weight="700" fill="#172033">Mes révisions</text>
<path class="draw" style="animation-delay:.5s" d="M45 120 C 120 113, 220 126, 318 116" fill="none" stroke="#b83226" stroke-width="3.5" stroke-linecap="round"/>
<text x="44" y="160" class="sans fade" style="animation-delay:.2s" font-size="18" fill="#2d3749">Le site de révision de mon M1 : 7 cours, fiches et formulaires, flashcards,</text>
<text x="44" y="186" class="sans fade" style="animation-delay:.2s" font-size="18" fill="#2d3749">QCM, annales corrigées et TP R, Python et D3 exécutés dans le navigateur.</text>
