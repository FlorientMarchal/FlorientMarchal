<rect x="420" y="307" width="8" height="8" fill="#141414" class="in" style="animation-delay:0.5s"/><text x="442" y="317" class="s in" font-size="17" fill="#141414" style="animation-delay:0.5s">Recherche sémantique : embeddings de texte et d'images (CLIP) dans Qdrant</text>
