"#141414" class="pop" style="animation-delay:1.10s"/><circle cx="75" cy="370" r="8" fill="#141414" class="pop" style="animation-delay:1.15s"/><circle cx="200" cy="300" r="14" fill="#ff4d1f" class="pop" style="animation-delay:1.3s"/><circle cx="200" cy="300" r="14" fill="none" stroke="#ff4d1f" stroke-width="3" style="transform-box:fill-box; transform-origin:center; animation:ring 1.8s ease-out 1.6s infinite"/><text x="222" y="305" class="m in" font-size="12" letter-spacing="2" fill="#f2ede3" style="animation-delay:1.4s">REQUÊTE</text><text x="34" y="470" class="m in" font-size="12" letter-spacing="2" fill="#f2ede3" style="animation-delay:.6s">ESPACE D'EMBEDDINGS · k PLUS PROCHES</text></g>
<text x="420" y="64" class="m in" font-size="13" letter-spacing="2.5" fill="#5b554b">PROJET DE STAGE · NLP · RAG · IA LOCALE</text>
<text x="1160" y="64" text-anchor="end" class="m in" font-size="13" letter-spacing="2.5" font-weight="700" fill="#141414">DÉPÔT ↗</text>
