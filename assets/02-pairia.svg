<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="500" viewBox="0 0 1200 500" role="img" aria-label="02 PairIA : boutique de chaussures en ligne avec un assistant IA local, projet de stage">
<style>
.s{font-family:'Helvetica Neue', Helvetica, Arial, sans-serif} .m{font-family:'SFMono-Regular', Menlo, Consolas, 'Liberation Mono', monospace}
.in{opacity:0; animation:in .7s cubic-bezier(.2,.75,.2,1) forwards}
.pop{opacity:0; transform-box:fill-box; transform-origin:center; animation:pop .6s cubic-bezier(.3,1.45,.5,1) forwards}
.left{opacity:0; animation:left .8s cubic-bezier(.2,.75,.2,1) forwards}
.draw{stroke-dasharray:1200; stroke-dashoffset:1200; animation:draw 2s cubic-bezier(.55,.1,.35,1) forwards}
.grow{transform-box:fill-box; transform-origin:bottom; transform:scaleY(0); animation:grow .8s cubic-bezier(.2,.75,.2,1) forwards}
@keyframes in{from{opacity:0; transform:translateY(10px)} to{opacity:1; transform:none}}
@keyframes left{from{opacity:0; transform:translateX(-30px)} to{opacity:1; transform:none}}
@keyframes pop{from{opacity:0; transform:scale(.3)} to{opacity:1; transform:scale(1)}}
@keyframes draw{to{stroke-dashoffset:0}}
@keyframes grow{to{transform:scaleY(1)}}
@keyframes spin{to{transform:rotate(360deg)}}
@keyframes breathe{from{transform:scaleY(1)} to{transform:scaleY(.72)}}
@keyframes b1{0%{opacity:0; transform:translateY(12px)} 8%,85%{opacity:1; transform:none} 95%,100%{opacity:0}}@keyframes b2{0%,25%{opacity:0; transform:translateY(12px)} 33%,85%{opacity:1; transform:none} 95%,100%{opacity:0}}@keyframes dot{0%,60%,100%{opacity:.3} 30%{opacity:1}}</style>
<rect width="1200" height="500" fill="#f2ede3"/>
<rect width="380" height="500" fill="#2442ff"/>
<text x="34" y="128" class="s in" font-size="120" font-weight="800" letter-spacing="-4" fill="#f2ede3">02</text>
<g><path d="M300 150L340 175L320 215L350 240M300 150L320 215" stroke="#f2ede3" stroke-width="1.5" opacity=".4" fill="none"/><circle cx="300" cy="150" r="6" fill="#f2ede3" opacity=".55"/><circle cx="340" cy="175" r="6" fill="#f2ede3" opacity=".55"/><circle cx="320" cy="215" r="6" fill="#f2ede3" opacity=".55"/><circle cx="350" cy="240" r="6" fill="#f2ede3" opacity=".55"/><g style="animation:b1 6s ease-in-out infinite"><rect x="40" y="190" width="240" height="78" rx="20" fill="#f2ede3"/><path d="M64 268 l0 24 l26 -24z" fill="#f2ede3"/><rect x="62" y="214" width="170" height="10" rx="5" fill="#141414" opacity=".8"/><rect x="62" y="236" width="120" height="10" rx="5" fill="#141414" opacity=".35"/></g><g style="animation:b2 6s ease-in-out infinite"><rect x="110" y="310" width="230" height="78" rx="20" fill="#141414"/><path d="M316 388 l0 24 l-26 -24z" fill="#141414"/><circle cx="196" cy="349" r="8" fill="#ffc21a" style="animation:dot 1.2s 0.0s infinite"/><circle cx="224" cy="349" r="8" fill="#ffc21a" style="animation:dot 1.2s 0.2s infinite"/><circle cx="252" cy="349" r="8" fill="#ffc21a" style="animation:dot 1.2s 0.4s infinite"/></g></g>
<text x="420" y="64" class="m in" font-size="13" letter-spacing="2.5" fill="#5b554b">PROJET DE STAGE · E-COMMERCE ET IA LOCALE</text>
<text x="1160" y="64" text-anchor="end" class="m in" font-size="13" letter-spacing="2.5" font-weight="700" fill="#141414">DÉPÔT ↗</text>
<line x1="420" y1="80" x2="1160" y2="80" stroke="#141414" stroke-width="2" class="in"/>
<text x="418" y="138" class="s in" font-size="46" font-weight="800" letter-spacing="-1.5" fill="#141414" style="animation-delay:.1s">PairIA</text>
<text x="420" y="178" class="s in" font-size="17" fill="#2a2620" style="animation-delay:.2s">Une boutique de chaussures en ligne complète, avec un assistant conversationnel qui</text>
<text x="420" y="204" class="s in" font-size="17" fill="#2a2620" style="animation-delay:.2s">tourne entièrement en local : aucune API payante, que des modèles open source.</text>
<rect x="420" y="241" width="12" height="12" fill="#2442ff" class="in" style="animation-delay:.3s"/><text x="442" y="252" class="m in" font-size="12" letter-spacing="3" font-weight="700" fill="#141414" style="animation-delay:.3s">CE QUE FAIT LE PROJET</text>
<rect x="420" y="276" width="8" height="8" fill="#141414" class="in" style="animation-delay:0.4s"/><text x="442" y="286" class="s in" font-size="17" fill="#141414" style="animation-delay:0.4s">Chatbot client : recherche en langage naturel, par photo (CLIP) ou à la voix (Whisper)</text>
<rect x="420" y="307" width="8" height="8" fill="#141414" class="in" style="animation-delay:0.5s"/><text x="442" y="317" class="s in" font-size="17" fill="#141414" style="animation-delay:0.5s">Chatbot admin : il gère la boutique en langage naturel avec 25 outils (function calling)</text>
<rect x="420" y="338" width="8" height="8" fill="#141414" class="in" style="animation-delay:0.6s"/><text x="442" y="348" class="s in" font-size="17" fill="#141414" style="animation-delay:0.6s">Pipeline RAG sur Qdrant, intentions classées par un CamemBERT affiné, LLM via Ollama</text>
<g class="pop" style="animation-delay:0.60s"><rect x="420" y="430" width="77" height="34" rx="17" fill="none" stroke="#141414" stroke-width="1.6"/><text x="458" y="452" text-anchor="middle" class="m" font-size="13" fill="#141414">Python</text></g><g class="pop" style="animation-delay:0.67s"><rect x="506.8" y="430" width="85" height="34" rx="17" fill="none" stroke="#141414" stroke-width="1.6"/><text x="549" y="452" text-anchor="middle" class="m" font-size="13" fill="#141414">FastAPI</text></g><g class="pop" style="animation-delay:0.74s"><rect x="601.4" y="430" width="77" height="34" rx="17" fill="none" stroke="#141414" stroke-width="1.6"/><text x="640" y="452" text-anchor="middle" class="m" font-size="13" fill="#141414">Ollama</text></g><g class="pop" style="animation-delay:0.81s"><rect x="688.1999999999999" y="430" width="77" height="34" rx="17" fill="none" stroke="#141414" stroke-width="1.6"/><text x="727" y="452" text-anchor="middle" class="m" font-size="13" fill="#141414">Qdrant</text></g><g class="pop" style="animation-delay:0.88s"><rect x="774.9999999999999" y="430" width="53" height="34" rx="17" fill="none" stroke="#141414" stroke-width="1.6"/><text x="802" y="452" text-anchor="middle" class="m" font-size="13" fill="#141414">PHP</text></g><g class="pop" style="animation-delay:0.95s"><rect x="838.3999999999999" y="430" width="69" height="34" rx="17" fill="none" stroke="#141414" stroke-width="1.6"/><text x="873" y="452" text-anchor="middle" class="m" font-size="13" fill="#141414">MySQL</text></g><g class="pop" style="animation-delay:1.02s"><rect x="917.3999999999999" y="430" width="77" height="34" rx="17" fill="none" stroke="#141414" stroke-width="1.6"/><text x="956" y="452" text-anchor="middle" class="m" font-size="13" fill="#141414">Docker</text></g>
</svg>
