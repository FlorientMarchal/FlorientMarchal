<rect x="320" y="288" width="8" height="8" fill="#141414" class="in" style="animation-delay:0.5s"/><text x="342" y="298" class="s in" font-size="17" fill="#141414" style="animation-delay:0.5s">Recherche sémantique : embeddings de texte et d'images (CLIP) dans la base vectorielle Qdrant</text>
