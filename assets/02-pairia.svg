1.05s"/><circle cx="160" cy="385" r="9" fill="#141414" class="pop" style="animation-delay:1.10s"/><circle cx="75" cy="370" r="9" fill="#141414" class="pop" style="animation-delay:1.15s"/><circle cx="200" cy="300" r="15" fill="#ff4d1f" class="pop" style="animation-delay:1.3s"/><circle cx="200" cy="300" r="15" fill="none" stroke="#ff4d1f" stroke-width="3" style="transform-box:fill-box; transform-origin:center; animation:ring 1.8s ease-out 1.6s infinite"/><text x="224" y="305" class="m in" font-size="15" letter-spacing="2" fill="#f2ede3" style="animation-delay:1.4s">REQUÊTE</text><text x="40" y="472" class="m in" font-size="14" letter-spacing="2" fill="#f2ede3" style="animation-delay:.6s">ESPACE D'EMBEDDINGS</text></g>
<text x="320" y="58" class="m in" font-size="13" letter-spacing="2.5" fill="#5b554b">MAI–JUIL. 2026 · STAGE · NLP · LLM · RAG</text>
<text x="1160" y="58" text-anchor="end" class="m in" font-size="13" letter-spacing="2.5" font-weight="700" fill="#141414">DÉPÔT ↗</text>
