<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="470" viewBox="0 0 1200 470" role="img" aria-label="Planche 02, PairIA : boutique de chaussures en ligne avec assistant IA local, projet de stage">
<style>
.s{font-family:'Helvetica Neue', Helvetica, Arial, sans-serif} .m{font-family:'SFMono-Regular', Menlo, Consolas, 'Liberation Mono', monospace}
.d{fill:none; stroke:#eaf2ff; stroke-width:2; stroke-linecap:round; stroke-linejoin:round;
   stroke-dasharray:1; stroke-dashoffset:1; animation:draw 1.6s cubic-bezier(.55,.1,.35,1) forwards}
.dc{stroke:#ff8a7a; stroke-width:2.5}
.dim{fill:none; stroke:#7fd3ff; stroke-width:1.2; stroke-dasharray:1; stroke-dashoffset:1; animation:draw 1s ease forwards}
.in{opacity:0; animation:in .6s ease forwards}
.pop{opacity:0; transform-box:fill-box; transform-origin:center; animation:pop .5s cubic-bezier(.3,1.45,.5,1) forwards}
@keyframes draw{to{stroke-dashoffset:0}}
@keyframes in{from{opacity:0} to{opacity:1}}
@keyframes pop{from{opacity:0; transform:scale(.2)} to{opacity:1; transform:scale(1)}}
@keyframes blink{50%{opacity:.2}}
@keyframes spin{to{transform:rotate(360deg)}}
</style>
<defs><pattern id="g" width="20" height="20" patternUnits="userSpaceOnUse"><path d="M20 0H0V20" fill="none" stroke="rgba(234,242,255,.07)"/></pattern><pattern id="G" width="100" height="100" patternUnits="userSpaceOnUse"><path d="M100 0H0V100" fill="none" stroke="rgba(234,242,255,.14)"/></pattern></defs><rect width="1200" height="470" fill="#123a7a"/><rect width="1200" height="470" fill="url(#g)"/><rect width="1200" height="470" fill="url(#G)"/><rect x="12" y="12" width="1176" height="446" fill="none" stroke="#eaf2ff" stroke-width="2.5"/><rect x="20" y="20" width="1160" height="430" fill="none" stroke="rgba(234,242,255,.55)" stroke-width="1"/><path d="M100 12V20M100 450V458M200 12V20M200 450V458M300 12V20M300 450V458M400 12V20M400 450V458M500 12V20M500 450V458M600 12V20M600 450V458M700 12V20M700 450V458M800 12V20M800 450V458M900 12V20M900 450V458M1000 12V20M1000 450V458M1100 12V20M1100 450V458M12 100H20M1180 100H1188M12 200H20M1180 200H1188M12 300H20M1180 300H1188M12 400H20M1180 400H1188" stroke="#eaf2ff" stroke-width="1.5"/>
<line x1="430" y1="20" x2="430" y2="450" stroke="rgba(234,242,255,.55)" stroke-width="1"/>
<g><path d="M70 80H360V126H70Z" pathLength="1" class="d" style="animation-delay:0.20s" /><text x="215" y="108" text-anchor="middle" class="m in" font-size="13" letter-spacing="1" fill="#eaf2ff" style="animation-delay:0.60s">QUESTION CLIENT</text><path d="M215 126V160M209 152L215 160L221 152" pathLength="1" class="dim" style="animation-delay:0.45s" /><path d="M70 160H360V206H70Z" pathLength="1" class="d" style="animation-delay:0.45s" /><text x="215" y="188" text-anchor="middle" class="m in" font-size="13" letter-spacing="1" fill="#eaf2ff" style="animation-delay:0.85s">CAMEMBERT · INTENTION</text><path d="M215 206V240M209 232L215 240L221 232" pathLength="1" class="dim" style="animation-delay:0.70s" /><path d="M70 240H360V286H70Z" pathLength="1" class="d" style="animation-delay:0.70s" /><text x="215" y="268" text-anchor="middle" class="m in" font-size="13" letter-spacing="1" fill="#eaf2ff" style="animation-delay:1.10s">RAG · QDRANT</text><path d="M215 286V320M209 312L215 320L221 312" pathLength="1" class="dim" style="animation-delay:0.95s" /><path d="M70 320H360V366H70Z" pathLength="1" class="d" style="animation-delay:0.95s" /><text x="215" y="348" text-anchor="middle" class="m in" font-size="13" letter-spacing="1" fill="#eaf2ff" style="animation-delay:1.35s">LLM · OLLAMA</text><circle r="6" fill="#ffd166"><animateMotion dur="2.6s" begin="0s" repeatCount="indefinite" path="M215 103V343"/></circle><path d="M360 343C400 343 400 400 360 400H90" pathLength="1" class="dim" style="animation-delay:1.40s" /><text x="70" y="430" class="m in" font-size="12" letter-spacing="1" fill="#ffd166" style="animation-delay:1.8s">→ RÉPONSE · 75 LANGUES</text></g>
<text x="40" y="52" class="m in" font-size="12" letter-spacing="3" fill="#7fd3ff">PLANCHE 02 / 05</text>
<text x="460" y="74" class="m in" font-size="38" font-weight="700" letter-spacing="1" fill="#eaf2ff" style="animation-delay:.1s">PAIRIA</text>
<path d="M462 90H605" pathLength="1" class="d" style="animation-delay:0.40s" />
<text x="460" y="126" class="s in" font-size="16.5" fill="#eaf2ff" style="animation-delay:.2s">Une boutique de chaussures en ligne complète, avec un assistant conversationnel</text>
<text x="460" y="151" class="s in" font-size="16.5" fill="#eaf2ff" style="animation-delay:.2s">qui tourne entièrement en local : aucune API payante, que des modèles open source.</text>
<text x="460" y="194" class="m in" font-size="11.5" letter-spacing="3" fill="#ffd166" style="animation-delay:.3s">CE QUE FAIT LE PROJET</text>
<text x="460" y="224" class="m in" font-size="13" font-weight="700" fill="#ffd166" style="animation-delay:0.40s">A</text><text x="486" y="224" class="s in" font-size="16" fill="#eaf2ff" style="animation-delay:0.40s">Chatbot client : recherche en langage naturel, par photo (CLIP) ou à la voix</text>
<text x="460" y="253" class="m in" font-size="13" font-weight="700" fill="#ffd166" style="animation-delay:0.52s">B</text><text x="486" y="253" class="s in" font-size="16" fill="#eaf2ff" style="animation-delay:0.52s">Chatbot admin : il gère la boutique en langage naturel avec 25 outils</text>
<text x="460" y="282" class="m in" font-size="13" font-weight="700" fill="#ffd166" style="animation-delay:0.64s">C</text><text x="486" y="282" class="s in" font-size="16" fill="#eaf2ff" style="animation-delay:0.64s">Pipeline RAG sur Qdrant, intentions classées par un CamemBERT affiné</text>
<g class="in" style="animation-delay:.6s"><rect x="460" y="374" width="200" height="56" fill="#0f3270" stroke="#eaf2ff" stroke-width="1.5"/><text x="472" y="393" class="m" font-size="10.5" letter-spacing="1.5" fill="#7fd3ff">CONTEXTE</text><text x="472" y="416" class="m" font-size="13.5" fill="#eaf2ff">PROJET DE STAGE</text><rect x="660" y="374" width="170" height="56" fill="#0f3270" stroke="#eaf2ff" stroke-width="1.5"/><text x="672" y="393" class="m" font-size="10.5" letter-spacing="1.5" fill="#7fd3ff">ÉQUIPE</text><text x="672" y="416" class="m" font-size="13.5" fill="#eaf2ff">3 PERSONNES</text><rect x="830" y="374" width="330" height="56" fill="#0f3270" stroke="#eaf2ff" stroke-width="1.5"/><text x="842" y="393" class="m" font-size="10.5" letter-spacing="1.5" fill="#7fd3ff">STACK</text><text x="842" y="416" class="m" font-size="13.5" fill="#eaf2ff">PYTHON · FASTAPI · PHP</text></g>
