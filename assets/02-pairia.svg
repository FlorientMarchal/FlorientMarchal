<text x="318" y="128" class="s in" font-size="44" font-weight="800" letter-spacing="-1.5" fill="#141414" style="animation-delay:.1s">PairIA</text>
<text x="320" y="166" class="s in" font-size="17" fill="#2a2620" style="animation-delay:.2s">Une boutique de chaussures en ligne avec un assistant IA conversationnel qui tourne entièrement</text>
<text x="320" y="192" class="s in" font-size="17" fill="#2a2620" style="animation-delay:.2s">en local : des modèles open source, aucune API payante.</text>
