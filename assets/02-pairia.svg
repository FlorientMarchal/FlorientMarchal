<text x="418" y="138" class="s in" font-size="46" font-weight="800" letter-spacing="-1.5" fill="#141414" style="animation-delay:.1s">PairIA</text>
<text x="420" y="178" class="s in" font-size="17" fill="#2a2620" style="animation-delay:.2s">Une boutique de chaussures en ligne avec un assistant conversationnel qui tourne</text>
<text x="420" y="204" class="s in" font-size="17" fill="#2a2620" style="animation-delay:.2s">entièrement en local : des modèles open source, aucune API payante.</text>
