<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="480" viewBox="0 0 1200 480" role="img" aria-label="Florient Marchal, étudiant en M1 MIASHS : statistiques, IA et web">
<style>
.s{font-family:'Helvetica Neue', Helvetica, Arial, sans-serif} .m{font-family:'SFMono-Regular', Menlo, Consolas, 'Liberation Mono', monospace}
.in{opacity:0; animation:in .7s cubic-bezier(.2,.75,.2,1) forwards}
.pop{opacity:0; transform-box:fill-box; transform-origin:center; animation:pop .6s cubic-bezier(.3,1.45,.5,1) forwards}
.left{opacity:0; animation:left .8s cubic-bezier(.2,.75,.2,1) forwards}
.draw{stroke-dasharray:1200; stroke-dashoffset:1200; animation:draw 2s cubic-bezier(.55,.1,.35,1) forwards}
.grow{transform-box:fill-box; transform-origin:bottom; transform:scaleY(0); animation:grow .8s cubic-bezier(.2,.75,.2,1) forwards}
@keyframes in{from{opacity:0; transform:translateY(10px)} to{opacity:1; transform:none}}
@keyframes left{from{opacity:0; transform:translateX(-30px)} to{opacity:1; transform:none}}
@keyframes pop{from{opacity:0; transform:scale(.3)} to{opacity:1; transform:scale(1)}}
@keyframes draw{to{stroke-dashoffset:0}}
@keyframes grow{to{transform:scaleY(1)}}
@keyframes spin{to{transform:rotate(360deg)}}
@keyframes breathe{from{transform:scaleY(1)} to{transform:scaleY(.72)}}
@keyframes marquee{to{transform:translateX(-1300px)}}</style>
<rect width="1200" height="480" fill="#f2ede3"/>
<text x="48" y="48" class="m in" font-size="13" letter-spacing="3" fill="#141414">FLORIENT MARCHAL — PROFIL</text>
<text x="1152" y="48" text-anchor="end" class="m in" font-size="13" letter-spacing="3" fill="#141414">M1 MIASHS · MONTPELLIER · 2026</text>
<line x1="48" y1="64" x2="1152" y2="64" stroke="#141414" stroke-width="2" class="in"/>
<circle cx="985" cy="232" r="138" fill="#ff4d1f" class="pop" style="animation-delay:.2s"/>
<rect x="770" y="250" width="130" height="130" fill="#2442ff" class="left" style="animation-delay:.45s"/>
<rect x="1060" y="96" width="92" height="46" fill="#ffc21a" class="pop" style="animation-delay:.6s"/>
<rect x="915" y="272" width="26" height="120" fill="#141414" class="grow" style="animation:grow .8s cubic-bezier(.2,.75,.2,1) 0.80s forwards, breathe 2.00s ease-in-out 1.80s infinite alternate"/>
<rect x="955" y="202" width="26" height="190" fill="#141414" class="grow" style="animation:grow .8s cubic-bezier(.2,.75,.2,1) 0.92s forwards, breathe 2.35s ease-in-out 1.92s infinite alternate"/>
<rect x="995" y="242" width="26" height="150" fill="#141414" class="grow" style="animation:grow .8s cubic-bezier(.2,.75,.2,1) 1.04s forwards, breathe 2.70s ease-in-out 2.04s infinite alternate"/>
<rect x="1035" y="162" width="26" height="230" fill="#141414" class="grow" style="animation:grow .8s cubic-bezier(.2,.75,.2,1) 1.16s forwards, breathe 3.05s ease-in-out 2.16s infinite alternate"/>
<rect x="1075" y="217" width="26" height="175" fill="#141414" class="grow" style="animation:grow .8s cubic-bezier(.2,.75,.2,1) 1.28s forwards, breathe 3.40s ease-in-out 2.28s infinite alternate"/>
<line x1="890" y1="392" x2="1130" y2="392" stroke="#141414" stroke-width="3" class="in" style="animation-delay:.7s"/>
<g style="transform-origin:985px 232px; animation:spin 14s linear infinite"><circle cx="985" cy="84" r="8" fill="#141414"/></g>
<text x="42" y="196" class="s in" font-size="138" font-weight="800" letter-spacing="-5" textLength="650" lengthAdjust="spacingAndGlyphs" fill="#141414" style="animation-delay:.1s">FLORIENT</text>
<text x="42" y="320" class="s in" font-size="138" font-weight="800" letter-spacing="-5" textLength="620" lengthAdjust="spacingAndGlyphs" fill="none" stroke="#141414" stroke-width="2.5" style="animation-delay:.25s">MARCHAL</text>
<text x="48" y="362" class="s in" font-size="20" fill="#141414" style="animation-delay:.5s">Étudiant en M1 MIASHS. Statistiques, IA et web :</text>
<text x="48" y="390" class="s in" font-size="20" font-weight="700" fill="#141414" style="animation-delay:.6s">j'aime transformer des données en outils.</text>
<rect x="0" y="420" width="1200" height="60" fill="#141414"/>
<g style="animation:marquee 22s linear infinite"><text x="0" y="457" class="m" font-size="19" letter-spacing="2" fill="#f2ede3" textLength="1300" lengthAdjust="spacing">STATISTIQUES ● SCIENCE DES DONNÉES ● IA LOCALE ● VISUALISATION ● R ● PYTHON ● PHP ● REACT ● </text><text x="1300" y="457" class="m" font-size="19" letter-spacing="2" fill="#f2ede3" textLength="1300" lengthAdjust="spacing">STATISTIQUES ● SCIENCE DES DONNÉES ● IA LOCALE ● VISUALISATION ● R ● PYTHON ● PHP ● REACT ● </text></g>
</svg>
