<line x1="430" y1="20" x2="430" y2="450" stroke="rgba(234,242,255,.55)" stroke-width="1"/>
<g><path d="M215 165L302 215L215 265L128 215ZM128 215V315L215 365L302 315V215M215 265V365" pathLength="1" class="d" style="animation-delay:0.20s" /><ellipse cx="215" cy="215" rx="12" ry="7" fill="#ffd166" class="pop" style="animation-delay:1.40s"/><ellipse cx="189" cy="270" rx="7" ry="10" transform="skewY(30 189 270)" fill="#ffd166" class="pop" style="animation-delay:1.50s"/><ellipse cx="154" cy="290" rx="7" ry="10" transform="skewY(30 154 290)" fill="#ffd166" class="pop" style="animation-delay:1.60s"/><ellipse cx="237" cy="272" rx="7" ry="10" transform="skewY(-30 237 272)" fill="#ffd166" class="pop" style="animation-delay:1.70s"/><ellipse cx="258" cy="285" rx="7" ry="10" transform="skewY(-30 258 285)" fill="#ffd166" class="pop" style="animation-delay:1.80s"/><ellipse cx="280" cy="298" rx="7" ry="10" transform="skewY(-30 280 298)" fill="#ffd166" class="pop" style="animation-delay:1.90s"/><path d="M60 150C110 80 320 80 370 150" pathLength="1" class="dim" style="animation-delay:1.00s" /><circle r="7" fill="#ff8a7a"><animateMotion dur="3s" begin="0s" repeatCount="indefinite" path="M60 150C110 80 320 80 370 150"/></circle><path d="M128 393V409M302 393V409M128 401H302" pathLength="1" class="dim" style="animation-delay:1.00s" /><path d="M137 397L128 401L137 405M293 397L302 401L293 405" pathLength="1" class="dim" style="animation-delay:1.00s" /><rect x="180" y="392" width="71" height="18" fill="#123a7a" class="in" style="animation-delay:1.40s"/><text x="215" y="405" text-anchor="middle" class="m in" font-size="12" fill="#7fd3ff" style="animation-delay:1.40s">13 JEUX</text></g>
