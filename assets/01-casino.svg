<text x="460" y="74" class="m in" font-size="38" font-weight="700" letter-spacing="1" fill="#eaf2ff" style="animation-delay:.1s">CASINO FANTÔME</text>
<path d="M462 90H795" pathLength="1" class="d" style="animation-delay:0.40s" />
<text x="460" y="126" class="s in" font-size="16.5" fill="#eaf2ff" style="animation-delay:.2s">Un simulateur de casino 100 % fictif : 13 jeux à débloquer, niveaux, classement</text>
<text x="460" y="151" class="s in" font-size="16.5" fill="#eaf2ff" style="animation-delay:.2s">et boutique. Tout le code est écrit par des agents IA, pilotés et relus par la promo.</text>
<text x="460" y="194" class="m in" font-size="11.5" letter-spacing="3" fill="#ffd166" style="animation-delay:.3s">MA PART · GROUPE 4, APPLICATION</text>
<text x="460" y="224" class="m in" font-size="13" font-weight="700" fill="#ffd166" style="animation-delay:0.40s">A</text><text x="486" y="224" class="s in" font-size="16" fill="#eaf2ff" style="animation-delay:0.40s">Les écrans Lobby, Profil, Classement, création de profil et page 404</text>
<text x="460" y="253" class="m in" font-size="13" font-weight="700" fill="#ffd166" style="animation-delay:0.52s">B</text><text x="486" y="253" class="s in" font-size="16" fill="#eaf2ff" style="animation-delay:0.52s">L'intégration des 11 interfaces de jeu du groupe 3 dans la page de jeu</text>
<text x="460" y="282" class="m in" font-size="13" font-weight="700" fill="#ffd166" style="animation-delay:0.64s">C</text><text x="486" y="282" class="s in" font-size="16" fill="#eaf2ff" style="animation-delay:0.64s">24 pull requests fusionnées, 7 revues de code et une vingtaine d'issues</text>
